spring.application.name=DBSpringDemo

spring.datasource.url=jdbc:mysql://localhost/intuitDemo?useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.properties.hibernate.format_sql=true
#hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#Actuator
info.app.name=Spring Boot Sample Application
info.app.description=Demo Application 
info.app.version=1.0.0

management.endpoints.web.exposure.include=*


springdoc.api-docs.path=/api-docs


spring.security.user.name=app
spring.security.user.password=app